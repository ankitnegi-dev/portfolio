name: Backend keepalive

on:
  schedule:
    # every 5 minutes - comfortably under Render's 15-minute idle sleep threshold
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you manually trigger a run from the Actions tab, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://portfolio-wfwx.onrender.com/health)
          echo "Backend responded with status $response"
          if [ "$response" -ne 200 ]; then
            echo "::warning::Backend health check returned $response instead of 200"
          fi